version: 2

git:
  ignore_tags:
    - shelly-exporter-0.2.0
    - shelly-exporter-0.2.1
    - shelly-exporter-0.2.2
    - shelly-exporter-0.2.3
    - shelly-exporter-0.2.4
    - shelly-exporter-0.2.5

before:
  hooks:
    # Deliberately `download`, not `tidy`: tidying here rewrote go.mod/go.sum
    # inside the release runner, so released binaries were built from a module
    # graph that was never committed. ci.yml enforces tidiness on every push to
    # main instead, and releases are cut from main.
    - go mod download

builds:
  - main: ./cmd/exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
