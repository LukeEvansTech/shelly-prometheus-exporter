---
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level: read-only by default (CKV2_GHA_1).
permissions:
  contents: read

jobs:
  lint:
    # Per-job: explicit write scopes for super-linter.
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@c0a5cd96f33a8af9b72488354d601e9d41fbe620 # v1
    with:
      # Soft-launch: this repo carries code inherited from the upstream project
      # (Supporterino/shelly_exporter) that has never been linted to the estate
      # standard. Non-blocking first, fix per-linter, then graduate to
      # `soft-launch: false` — the house rollout rule.
      soft-launch: true
      # No Kubernetes manifests here; the Helm chart is rendered and asserted by
      # ci.yml instead, which is CRD- and template-aware in a way raw
      # kubeconform against chart sources is not.
      validate-kubernetes-kubeconform: false
      # super-linter's two Go linters are structurally incompatible with this
      # repo's layout, and both fail having linted nothing:
      #
      #   GO         passes the changed .go files to golangci-lint as a flat
      #              list; golangci-lint rejects any list spanning packages
      #              ("named files must all be in one directory"). Any PR
      #              touching two of cmd/ client/ config/ metrics/ rpc/ fails.
      #              It still prints "0 issues." to stdout while erroring on
      #              stderr, so the failure looks like a lint finding.
      #   GO_MODULES runs golangci-lint against the module root, which holds no
      #              .go files, so it aborts with "no go files to analyze" on
      #              every PR that touches go.mod -- every Renovate Go bump.
      #
      # Neither is fixable from this repo. Go quality is owned by ci.yml, which
      # runs build, vet and test -race against ./... on every PR. Adding
      # `golangci-lint run ./...` there (with a committed .golangci.yml) is the
      # tracked follow-up -- it has no such restriction and would restore the
      # gosec/revive coverage these two were nominally providing.
      validate-go: false
      validate-go-modules: false
